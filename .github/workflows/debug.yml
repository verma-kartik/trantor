name: Debug Build and Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  debug-build:
    name: Debug - ${{ matrix.os }} - ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds with debug mode
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc-11
            cxx: g++-11
          
          - os: ubuntu-latest
            compiler: clang
            cc: clang-14
            cxx: clang++-14
          
          # macOS builds with debug mode
          - os: macos-latest
            compiler: gcc
            cc: gcc-11
            cxx: g++-11
          
          - os: macos-latest
            compiler: clang
            cc: clang
            cxx: clang++

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
          sudo apt-get update
          sudo apt-get install -y cmake libsqlite3-dev pkg-config
          if [[ "${{ matrix.compiler }}" == "gcc" ]]; then
            sudo apt-get install -y gcc-11 g++-11
          else
            sudo apt-get install -y clang-14
          fi
        elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
          brew install cmake sqlite3 pkg-config
          if [[ "${{ matrix.compiler }}" == "gcc" ]]; then
            brew install gcc@11
          fi
        fi

    - name: Set up environment
      run: |
        echo "CC=${{ matrix.cc }}" >> $GITHUB_ENV
        echo "CXX=${{ matrix.cxx }}" >> $GITHUB_ENV

    - name: Configure CMake (Debug)
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER=${{ matrix.cc }} \
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
          -DCMAKE_CXX_FLAGS="-g -O0 -DDEBUG"

    - name: Build (Debug)
      run: cmake --build build --parallel $(nproc 2>/dev/null || sysctl -n hw.ncpu)

    - name: Test (Debug)
      working-directory: build
      run: ctest --output-on-failure --verbose

    - name: Memory Check (Linux only)
      if: matrix.os == 'ubuntu-latest'
      working-directory: build
      run: |
        sudo apt-get install -y valgrind
        echo "Running memory check on tests:"
        valgrind --error-exitcode=1 --leak-check=full ./tests/ormcpp_tests || echo "Valgrind completed"