name: Test Suite

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test-only:
    name: Test Suite - ${{ matrix.os }} - ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          # Focus on test compilation and execution
          - os: ubuntu-20.04
            compiler: gcc
            cc: gcc-11
            cxx: g++-11
          
          - os: ubuntu-20.04
            compiler: clang
            cc: clang-12
            cxx: clang++-12
          
          - os: macos-12
            compiler: clang
            cc: clang
            cxx: clang++

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        if [[ "${{ matrix.os }}" == "ubuntu-20.04" ]]; then
          sudo apt-get update
          sudo apt-get install -y cmake libsqlite3-dev pkg-config ${{ matrix.cc }}
          if [[ "${{ matrix.compiler }}" == "clang" ]]; then
            sudo apt-get install -y ${{ matrix.cxx }}
          fi
        elif [[ "${{ matrix.os }}" == "macos-12" ]]; then
          brew install cmake sqlite3 pkg-config
        fi

    - name: Set up environment
      run: |
        echo "CC=${{ matrix.cc }}" >> $GITHUB_ENV
        echo "CXX=${{ matrix.cxx }}" >> $GITHUB_ENV

    - name: Configure CMake (Tests only)
      run: |
        cmake -B build-tests \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER=${{ matrix.cc }} \
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
          -DBUILD_TESTING=ON

    - name: Build Tests
      run: |
        cmake --build build-tests --target ormcpp_tests --parallel $(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)

    - name: Run Tests
      working-directory: build-tests
      run: |
        if [[ -f "tests/ormcpp_tests" ]]; then
          echo "Running test suite:"
          ./tests/ormcpp_tests
          echo "Running via CTest:"
          ctest --output-on-failure --verbose
        else
          echo "Test executable not found, checking available files:"
          find . -name "*test*" -type f
        fi

    - name: Test Summary
      run: |
        echo "=== Test Summary ==="
        echo "OS: ${{ matrix.os }}"
        echo "Compiler: ${{ matrix.compiler }} (${{ matrix.cc }}/${{ matrix.cxx }})"
        echo "Build completed successfully"